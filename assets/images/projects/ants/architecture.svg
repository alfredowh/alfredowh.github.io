<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">ANTS: show once, test, repair</title>
  <desc id="description">ANTS Studio is the interface; Python orchestration controls the policy-development loop. System 1 Synthesizer extracts a human demonstration into DemoSpec. Its planned Author prompt stage uses Muse Spark to prepare a task template from the video, JSON and a worked example; Muse Wonder generates or repairs the robot program. System 2 Adversary proposes bounded tests and diagnoses simulation failures. A code-enforced regression gate replays acceptance cases and discovered failures. Held-out evaluation reports results without feeding synthesis. Dashed stages, including reusable prompt integration, memory, shared skills and deployment, are planned.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#526272"/></marker>
    <symbol id="meta" viewBox="0 0 24 14"><path d="M12 7C9.5 3 7.6 1.5 5.5 1.5 3 1.5 1.5 4 1.5 7S3 12.5 5.3 12.5C7.5 12.5 9.5 11 12 7ZM12 7C14.5 3 16.4 1.5 18.5 1.5 21 1.5 22.5 4 22.5 7S21 12.5 18.7 12.5C16.5 12.5 14.5 11 12 7Z" fill="none" stroke="#0866ff" stroke-width="2.3" stroke-linejoin="round"/></symbol>
    <symbol id="cache" viewBox="0 0 24 28"><g fill="#455b6d"><ellipse cx="12" cy="5" rx="10" ry="4"/><path d="M2 8C7 12 17 12 22 8V14C22 20 2 20 2 14ZM2 18C7 22 17 22 22 18V23C22 29 2 29 2 23Z"/></g></symbol>
  </defs>
