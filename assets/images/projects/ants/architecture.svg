    .body{font-size:17px;fill:#455b6d}
    .small{font-size:15px;fill:#455b6d}
    .label{font-size:15px;fill:#455b6d;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
    .eyebrow{font-size:14px;font-weight:700;fill:#455b6d}
    .edge{fill:none;stroke:#526272;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .planned{stroke-dasharray:6 5}
    .box{fill:#fff;stroke:#8495a4;stroke-width:1.5}
  </style>
  <rect width="1400" height="900" fill="#fff"/>
