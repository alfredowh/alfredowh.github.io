<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="758" viewBox="0 0 1200 650" style="width:100%;height:auto;max-width:1400px;display:block" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Author prompt</title>
<desc id="desc">System 1 Synthesizer: new task video frames and DemoSpec join a worked bowl example and fixed robot context in a Muse Spark call. The reusable template is validated and filled with measured values before Muse Wonder generates a robot program. Dashed blue denotes proposed workflow.</desc>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#526272"/></marker><symbol id="meta" viewBox="0 0 24 14"><path d="M12 7C9.5 3 7.6 1.5 5.5 1.5 3 1.5 1.5 4 1.5 7S3 12.5 5.3 12.5C7.5 12.5 9.5 11 12 7ZM12 7C14.5 3 16.4 1.5 18.5 1.5 21 1.5 22.5 4 22.5 7S21 12.5 18.7 12.5C16.5 12.5 14.5 11 12 7Z" fill="none" stroke="#0866ff" stroke-width="2.3" stroke-linejoin="round"/></symbol></defs>
<style>text{letter-spacing:0;fill:#162b3b}rect{rx:6px}.n{fill:#fff;stroke:#8495a4;stroke-width:1.5}.p{fill:#edf5ff;stroke:#387bc1;stroke-width:1.7;stroke-dasharray:6 5}.h{fill:#fbeef5;stroke:#bd7d9d;stroke-width:1.5}.t{font-size:17px;font-weight:700;fill:#162b3b}.s{font-size:13px;fill:#455b6d}.e{fill:none;stroke:#526272;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.l{font-size:12px;fill:#455b6d;paint-order:stroke;stroke:#fff;stroke-width:5px}</style>
<rect width="1200" height="650" fill="#fff"/>
<text x="28" y="30" font-size="22" font-weight="700">Author prompt</text>
<text x="28" y="52" class="s">Proposed reusable-template workflow. The existing prototype produces a filled paragraph instead.</text>
<rect x="20" y="76" width="1160" height="316" fill="#f7faff" stroke="#b4cee8"/>
<text x="36" y="101" font-size="14" font-weight="700">SYSTEM 1 · SYNTHESIZER · AUTHOR ONCE PER NEW TASK</text>
<rect x="42" y="122" width="222" height="80" class="h"/><text x="153" y="148" text-anchor="middle" class="t">New task + human video</text><text x="153" y="170" text-anchor="middle" class="s">task instruction</text><text x="153" y="188" text-anchor="middle" class="s">sampled keyframes</text>
<rect x="42" y="244" width="222" height="80" class="n"/><text x="153" y="270" text-anchor="middle" class="t">DemoSpec JSON</text><text x="153" y="292" text-anchor="middle" class="s">measured object-relative data</text><text x="153" y="310" text-anchor="middle" class="s">field names, units, quality</text>
<rect x="314" y="122" width="242" height="80" class="p"/><text x="435" y="148" text-anchor="middle" class="t">Bowl-on-plate example</text><text x="435" y="170" text-anchor="middle" class="s">example frames + matching JSON</text><text x="435" y="188" text-anchor="middle" class="s">+ desired demonstration prompt</text>
<rect x="314" y="244" width="242" height="80" class="p"/><text x="435" y="270" text-anchor="middle" class="t">Fixed authoring instructions</text><text x="435" y="292" text-anchor="middle" class="s">robot capabilities + API context</text><text x="435" y="310" text-anchor="middle" class="s">no invented measurements</text>
<rect x="620" y="196" width="184" height="82" class="p"/><use href="#meta" x="636" y="212" width="24" height="14"/><text x="728" y="225" text-anchor="middle" class="t">Muse Spark</text><text x="712" y="246" text-anchor="middle" class="s">authors task-specific text</text><text x="712" y="265" text-anchor="middle" class="s">and JSON-field bindings</text>
<rect x="870" y="196" width="280" height="82" class="p"/><text x="1010" y="225" text-anchor="middle" class="t">Reusable task template</text><text x="1010" y="246" text-anchor="middle" class="s">descriptions + typed placeholders</text><text x="1010" y="265" text-anchor="middle" class="s">no copied example measurements</text>
<path class="e" d="M264 162H286V220H620"/><path class="e" d="M264 284H286V236H620"/><path class="e" d="M556 162H586V208H620"/><path class="e" d="M556 284H602V260H620"/><path class="e" d="M804 237H870"/>
<text x="180" y="363" class="s">Evidence boundary: describe supported actions; missing fields remain unknown, not guessed.</text>
<rect x="870" y="426" width="280" height="82" class="p"/><text x="1010" y="454" text-anchor="middle" class="t">Validate + save</text><text x="1010" y="475" text-anchor="middle" class="s">field bindings, units, grounding</text><text x="1010" y="494" text-anchor="middle" class="s">stop on missing required evidence</text>
<rect x="570" y="426" width="234" height="82" class="p"/><text x="687" y="454" text-anchor="middle" class="t">Fill deterministically</text><text x="687" y="475" text-anchor="middle" class="s">template + DemoSpec values</text><text x="687" y="494" text-anchor="middle" class="s">no model call for filling</text>
<rect x="286" y="426" width="220" height="82" class="p"/><text x="396" y="454" text-anchor="middle" class="t">Demonstration prompt</text><text x="396" y="475" text-anchor="middle" class="s">task-specific, measured context</text><text x="396" y="494" text-anchor="middle" class="s">ready for policy generation</text>
<rect x="42" y="426" width="180" height="82" fill="#edf5ff" stroke="#387bc1" stroke-width="1.7"/><use href="#meta" x="49" y="441" width="24" height="14"/><text x="143" y="454" text-anchor="middle" class="t">Muse Wonder</text><text x="132" y="475" text-anchor="middle" class="s">writes robot program</text><text x="132" y="494" text-anchor="middle" class="s">nominal check follows</text>
<path class="e" d="M1010 278V426"/><text x="1022" y="410" class="l">template artifact</text><path class="e" d="M870 467H804"/><text x="813" y="456" class="l">valid</text><path class="e" d="M570 467H506"/><path class="e" d="M286 467H222"/>
<path class="e" d="M153 324V406H687V426"/><text x="320" y="400" class="l">measured values from this demonstration</text>
<text x="42" y="549" class="s">Program API and safety rules remain fixed; they are not rewritten by the template author.</text>
<g transform="translate(42,580)"><rect width="22" height="13" class="n"/><text x="30" y="12" class="s">existing component</text><rect x="192" width="22" height="13" class="p"/><text x="222" y="12" class="s">proposed workflow</text><rect x="410" width="22" height="13" class="h"/><text x="440" y="12" class="s">human input</text></g>
<text x="42" y="626" class="s">Planned: reusable bindings, validation and pipeline integration. All model weights remain frozen.</text>
