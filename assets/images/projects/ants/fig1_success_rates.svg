<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" width="100%" style="max-width:760px" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Stock scene: demo 7/10, no demo 0/10. Scaled scene: demo 7/10, no demo 8/10."><rect width="760" height="354" rx="8" fill="#fcfcfb"/><text x="20.0" y="30.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Stock scene: demo 7/10, no demo 0/10. Scaled scene: demo 7/10, no demo 8/10.</text><text x="20.0" y="52.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Final programs on held-out seeds 1 to 5. Small sample: read the intervals, not just the dots.</text><line x1="650.0" y1="130.0" x2="650.0" y2="300.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/><line x1="515.0" y1="130.0" x2="515.0" y2="300.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/><line x1="380.0" y1="130.0" x2="380.0" y2="300.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/><line x1="245.0" y1="130.0" x2="245.0" y2="300.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/><line x1="110.0" y1="130.0" x2="110.0" y2="300.0" stroke="#e4e3df" stroke-width="1" stroke-linecap="round"/><circle cx="26" cy="88" r="6" fill="#2a78d6"/><text x="38.0" y="92.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">Demo + scene text + contact evidence</text><circle cx="348" cy="88" r="6" fill="#eb6834"/><text x="360.0" y="92.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">No demo: task text only</text><text x="20.0" y="120.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Scaled scene: real-size objects, where programs were repaired</text><text x="98.0" y="147.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">Demo</text><line x1="297.7" y1="142.0" x2="614.0" y2="142.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><g><title>Demo, scaled: 7 of 10 passed. Exact 95% interval 35% to 93%.</title><circle cx="488.0" cy="142" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/></g><text x="626.0" y="147.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">7/10</text><text x="98.0" y="177.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">No demo</text><line x1="349.7" y1="172.0" x2="636.4" y2="172.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><g><title>No demo, scaled: 8 of 10 passed. Exact 95% interval 44% to 97%.</title><circle cx="542.0" cy="172" r="8" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/></g><text x="648.4" y="177.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">8/10</text><text x="20.0" y="218.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Stock scene: other object sizes, never seen in repair</text><text x="98.0" y="245.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">Demo</text><line x1="297.7" y1="240.0" x2="614.0" y2="240.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><g><title>Demo, stock: 7 of 10 passed. Exact 95% interval 35% to 93%.</title><circle cx="488.0" cy="240" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/></g><text x="626.0" y="245.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">7/10</text><text x="98.0" y="275.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">No demo</text><line x1="110.0" y1="270.0" x2="276.6" y2="270.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><g><title>No demo, stock: 0 of 10 passed. Exact 95% interval 0% to 31%.</title><circle cx="110.0" cy="270" r="8" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/></g><text x="288.6" y="275.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">0/10</text><text x="110.0" y="316.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">0%</text><text x="245.0" y="316.0" font-size="12" fill="#52514e" 